<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#161B33">
<title>Sem conexão - SETIC</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #161B33; color: #fff; padding: 24px; box-sizing: border-box; }
  .cartao { max-width: 420px; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 1.4rem; margin: 20px 0 8px; }
  p { color: #cbd5e1; line-height: 1.5; }
  button { margin-top: 16px; background: #eab308; color: #161B33; border: 0; border-radius: 8px; padding: 12px 24px; font-weight: 700; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
  <div class="cartao">
    <img src="/icons/icon-192.png" alt="">
    <h1>Sem conexão com a internet</h1>
    <p>O sistema SETIC precisa de internet para acessar os dados. Verifique a conexão e tente novamente.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão de Estoque - SETIC</title>
    <!-- Aplicativo instalável (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#161B33">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SETIC">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script>
    // ===== Aplicativo (PWA): instalação no computador e no celular =====
    (function () {
        let pedidoInstalacao = null;
        const abertoComoApp = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        // Lembra (neste navegador) que o app já foi instalado; se for desinstalado, o navegador volta a oferecer e o botão reaparece.
        const marcadoInstalado = () => { try { return localStorage.getItem('pwa_instalado') === 'sim'; } catch (e) { return false; } };
        const marcarInstalado = valor => { try { valor ? localStorage.setItem('pwa_instalado', 'sim') : localStorage.removeItem('pwa_instalado'); } catch (e) {} };
        const instalado = () => abertoComoApp() || (marcadoInstalado() && !pedidoInstalacao);
        const ehIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        function atualizarInstalacao() {
            const botao = document.getElementById('btn-instalar');
            if (botao) botao.classList.toggle('hidden', instalado());
            const status = document.getElementById('pwa-status'), botaoPref = document.getElementById('btn-instalar-prefs');
            if (status) status.textContent = abertoComoApp() ? 'O sistema está aberto como aplicativo instalado neste aparelho.'
                : instalado() ? 'O aplicativo SETIC já está instalado neste aparelho. Abra pelo atalho SETIC.'
                : pedidoInstalacao ? 'Este navegador permite instalar o aplicativo. Clique em "Instalar aplicativo".'
                : ehIOS() ? 'No iPhone/iPad, clique em "Instalar aplicativo" para ver o passo a passo do Safari.'
                : 'Clique em "Instalar aplicativo". Se o navegador ainda não liberar a instalação direta, aparece o passo a passo.';
            if (botaoPref) botaoPref.classList.toggle('hidden', instalado());
        }
        window.addEventListener('beforeinstallprompt', evento => { evento.preventDefault(); pedidoInstalacao = evento; marcarInstalado(false); atualizarInstalacao(); });
        window.addEventListener('appinstalled', () => { pedidoInstalacao = null; marcarInstalado(true); atualizarInstalacao(); });
        if (abertoComoApp()) marcarInstalado(true);
        function descreverAparelho() {
            const ua = navigator.userAgent;
            const navegador = /Edg\//.test(ua) ? 'Edge' : /SamsungBrowser/.test(ua) ? 'Samsung Internet' : /Firefox|FxiOS/.test(ua) ? 'Firefox' : /OPR\//.test(ua) ? 'Opera' : /CriOS|Chrome/.test(ua) ? 'Chrome' : /Safari/.test(ua) ? 'Safari' : 'navegador';
            const sistema = ehIOS() ? 'iPhone/iPad' : /Android/i.test(ua) ? 'Android' : 'Computador';
            return { navegador, sistema };
        }
        function passosInstalacao({ navegador, sistema }) {
            if (sistema === 'iPhone/iPad') return navegador === 'Safari'
                ? ['Toque em <b>Compartilhar</b> (o quadrado com uma seta para cima), na barra do Safari.', 'Role e toque em <b>Adicionar à Tela de Início</b>.', 'Toque em <b>Adicionar</b>. O ícone SETIC aparece na tela inicial.']
                : ['No iPhone, a instalação só funciona pelo <b>Safari</b>.', 'Copie o endereço do sistema e abra no <b>Safari</b>.', 'Depois toque em <b>Compartilhar → Adicionar à Tela de Início</b>.'];
            if (sistema === 'Android') return navegador === 'Samsung Internet'
                ? ['Toque no menu <b>☰</b> (canto inferior).', 'Toque em <b>Adicionar página a → Tela inicial</b>.']
                : ['Toque no menu <b>⋮</b> do Chrome (canto superior direito).', 'Toque em <b>Instalar aplicativo</b> (ou <b>Adicionar à tela inicial</b>).', 'Confirme em <b>Instalar</b>.'];
            if (navegador === 'Firefox') return ['O Firefox para computador não instala aplicativos.', 'Abra o sistema no <b>Chrome</b> ou no <b>Edge</b> e clique em <b>Instalar app</b>.'];
            if (navegador === 'Edge') return ['Clique no menu <b>⋯</b> (canto superior direito).', 'Vá em <b>Aplicativos → Instalar este site como um aplicativo</b>.', 'Confirme em <b>Instalar</b>.'];
            return ['Clique no ícone de instalação (<b>monitor com seta</b>) no lado direito da barra de endereço,', 'ou no menu <b>⋮</b> do Chrome → <b>Transmitir, salvar e compartilhar → Instalar página como app</b> (ou <b>Instalar SETIC…</b>).', 'Confirme em <b>Instalar</b>.'];
        }
        // Diagnóstico: mostra o que impede o navegador de liberar a instalação direta.
        async function diagnosticarInstalacao() {
            const itens = [];
            if (!window.isSecureContext) itens.push('❌ O endereço não é seguro (https). O aplicativo só instala em https.');
            try { const r = await fetch('/manifest.webmanifest', { cache: 'no-store' }); const m = r.ok ? await r.json().catch(() => null) : null;
                  itens.push(m && m.short_name ? '✅ Arquivo do aplicativo (manifesto) encontrado no servidor.' : '❌ Manifesto não encontrado no servidor: falta publicar <b>manifest.webmanifest</b> na raiz do repositório.'); }
            catch (e) { itens.push('❌ Não foi possível ler o manifesto (sem conexão?).'); }
            try { const r = await fetch('/icons/icon-192.png', { cache: 'no-store' }); itens.push(r.ok && (r.headers.get('content-type') || '').includes('image') ? '✅ Ícones encontrados.' : '❌ Ícones não encontrados: falta publicar a pasta <b>icons</b> na raiz.'); }
            catch (e) {}
            if (!('serviceWorker' in navigator)) itens.push('❌ Este navegador não aceita instalação de aplicativos.');
            else { const reg = await navigator.serviceWorker.getRegistration().catch(() => null);
                   itens.push(reg && reg.active ? '✅ Componente do aplicativo (sw.js) ativo.' : '❌ Componente do aplicativo inativo: confira se <b>sw.js</b> está na raiz do repositório e recarregue com Ctrl+F5.'); }
            if (!pedidoInstalacao && itens.every(i => i.startsWith('✅'))) itens.push('ℹ️ Tudo publicado corretamente. O navegador ainda não liberou a instalação direta (às vezes leva alguns segundos ou exige uma segunda visita) — use os passos acima.');
            return itens;
        }
        async function abrirAjudaInstalacao() {
            const aparelho = descreverAparelho(), janela = document.getElementById('pwa-ajuda');
            document.getElementById('pwa-ajuda-aparelho').textContent = `Seu aparelho: ${aparelho.sistema} · ${aparelho.navegador}`;
            document.getElementById('pwa-ajuda-passos').innerHTML = passosInstalacao(aparelho).map(p => `<li>${p}</li>`).join('');
            const diag = document.getElementById('pwa-ajuda-diagnostico'); diag.textContent = 'Verificando…';
            if (!janela.open) janela.showModal();
            diag.innerHTML = '<b>Verificação:</b><br>' + (await diagnosticarInstalacao()).join('<br>');
        }
        window.instalarAplicativo = async function () {
            if (instalado()) { atualizarInstalacao(); return; }
            if (!pedidoInstalacao) { abrirAjudaInstalacao(); return; }
            pedidoInstalacao.prompt();
            let escolha = null; try { escolha = await pedidoInstalacao.userChoice; } catch (e) {}
            if (escolha && escolha.outcome === 'accepted') marcarInstalado(true);
            pedidoInstalacao = null; atualizarInstalacao();
        };
        document.addEventListener('DOMContentLoaded', atualizarInstalacao);
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(erro => console.warn('Aplicativo (PWA) indisponível:', erro)));
        }
    })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        .modern-card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(226, 232, 240, 0.8); }
        .dark { background-color: #0F172A; color: #E2E8F0; }
        .dark .bg-white, .dark .modern-card { background-color: #1E293B; border-color: #334155; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .dark .text-gray-800, .dark .text-slate-800 { color: #F8FAFC; }
        .dark .text-gray-500, .dark .text-slate-500 { color: #94A3B8; }
        .dark table thead th { background-color: #334155; color: #F1F5F9; }
        .dark table tbody tr { border-color: #334155; }
        .dark table tbody tr:hover { background-color: #475569; }
        .dark input, .dark select, .dark input[type="file"] { background-color: #334155; color: white; border-color: #475569; }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
        @keyframes chatPopUp { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .chat-window-anim { animation: chatPopUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .chat-bubble-ai { background: #F1F5F9; color: #1E293B; border-radius: 16px 16px 16px 4px; padding: 10px 14px; font-size: 13px; max-width: 85%; margin-bottom: 8px; line-height: 1.5; }
        .chat-bubble-user { background: #3B82F6; color: #FFFFFF; border-radius: 16px 16px 4px 16px; padding: 10px 14px; font-size: 13px; max-width: 85%; margin-bottom: 8px; margin-left: auto; line-height: 1.5; }
        @media print {
            body { background-color: white; }
            #login-screen, #main-system, #tools-modal, #toast-container, #ai-chatbot-container { display: none !important; }
            .print-bg { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print { display: none !important; }
            table { border-collapse: collapse; width: 100%; font-size: 10pt;}
            th, td { border: 1px solid #cbd5e1; padding: 6px; }
            @page { margin: 1cm; }
            #printable-report.active-print { display: block !important; position: absolute; left:0; top:0; width: 100%; background: white; color: black; z-index: 9999; page: portrait; }
            #printable-report.active-print th { background-color: #f8fafc !important; color: black !important; }
            #printable-simple-table.active-print { display: block !important; position: absolute; left: 0; top: 0; width: 100%; padding: 20px; background: white; color: black; z-index: 9999; page: landscape; }
            #printable-simple-table.active-print th { background-color: #161B33 !important; color: white !important; }
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        .toast-exit { animation: slideOut 0.3s ease-in forwards; }

        /* ASSISTENTE SETIC V2 — estilos isolados */
        #ai-chatbot-container .ai-fab img, #ai-chatbot-container .ai-header-avatar img { pointer-events:none; }
        #ai-chatbot-container .ai-fab { padding:1px; }
        #ai-chatbot-container .chat-bubble-ai { background:#fff; color:#334155; border-radius:16px 16px 16px 4px; padding:10px 12px; font-size:13px; max-width:94%; margin-bottom:8px; margin-right:auto; line-height:1.45; }
        #ai-chatbot-container .chat-bubble-user { background:#2563eb; color:#fff; border-radius:16px 16px 4px 16px; padding:10px 14px; font-size:13px; max-width:85%; margin-bottom:8px; margin-left:auto; line-height:1.5; }
